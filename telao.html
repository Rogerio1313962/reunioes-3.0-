<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REUNIÕES 3.0 · Telão</title><style>html,body{height:100%;margin:0;background:#03070e;color:white;font-family:Arial,sans-serif}#stage{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:4vw;box-sizing:border-box}.verse{font-size:clamp(30px,4.3vw,85px);line-height:1.3;white-space:pre-wrap}.verse small{display:block;color:#a7c5ff;font-size:.42em;margin-top:28px}img,video{max-width:100%;max-height:100%;object-fit:contain}iframe{width:100%;height:100%;border:0}.placeholder{color:#58647b;font-size:32px}</style></head><body><div id="stage"><div class="placeholder">REUNIÕES 3.0<br><small>Aguardando apresentação</small></div></div><script>const ch=new BroadcastChannel('reunioes3-projetor');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));ch.onmessage=e=>{if(e.data.kind==='volume'){const v=document.querySelector('#stage video');if(v){v.volume=e.data.volume;v.muted=e.data.muted}return}if(e.data.kind!=='present')return;const x=e.data.item;const stage=document.getElementById('stage');if(!x){stage.innerHTML='';return}if(x.type==='versiculo')stage.innerHTML=`<div class="verse">${esc(x.content)}<small>${esc(x.reference)} · ${esc(x.translation)}</small></div>`;if(x.type==='texto')stage.innerHTML=`<div class="verse">${esc(x.content)}</div>`;if(x.type==='imagem')stage.innerHTML=`<img src="${x.fileUrl}">`;if(x.type==='video')stage.innerHTML=`<video src="${x.fileUrl}" autoplay controls></video>`;if(x.type==='pdf')stage.innerHTML=`<iframe src="${x.fileUrl}"></iframe>`};</script></body></html>
